services:
  - type: web
    name: second-brain
    env: node
    plan: free
    buildCommand: npm ci && npm run build --workspace=@second-brain/dashboard
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/nudge.sqlite
      - key: DEMO_SOURCE_ACCOUNT_ID
        value: local
      - key: NODE_VERSION
        value: 22.14.0
