<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body { font: 13px -apple-system, Segoe UI, Roboto, sans-serif; width: 300px; padding: 16px; color: #1a1d21; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .sub { color: #6b7280; font-size: 12px; margin-bottom: 14px; line-height: 1.4; }
    label { font-weight: 650; font-size: 12px; display: block; margin: 10px 0 4px; }
    input { width: 100%; padding: 8px 10px; border: 1px solid #e2e5e9; border-radius: 8px; font-size: 13px; }
    input:focus { outline: 2px solid #99f6e4; border-color: #0f766e; }
    button { margin-top: 12px; background: #0f766e; color: #fff; border: none; padding: 9px 14px; border-radius: 8px; font-weight: 650; cursor: pointer; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; display: inline-block; }
    .status { font-size: 12px; margin-top: 8px; min-height: 18px; }
    .success { color: #15803d; } .error { color: #be123c; }
    .hint, .premium { color: #7b828c; font-size: 11px; margin-top: 12px; line-height: 1.45; }
    .premium { padding-top: 10px; border-top: 1px solid #eceef1; }
    .tag { color: #a16207; font-weight: 750; }
  </style>
</head>
<body>
  <h1><span class="dot"></span> NUDGE</h1>
  <div class="sub">Mirrors native X bookmark clicks and analyzes agreement pages on your hosted NUDGE profile.</div>
  <label for="token">Capture token</label>
  <input id="token" type="password" autocomplete="off" placeholder="Paste the token from NUDGE Profile" />
  <button id="save" type="button">Connect</button>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="hint">Use X&rsquo;s own bookmark button. No injected save button is added.</div>
  <div class="premium"><span class="tag">PREMIUM — NOT ENABLED</span><br />Import my past bookmarks is intentionally inert on the free plan.</div>
  <script src="popup.js"></script>
</body>
</html>
